name: Database

# Applies new migrations to the Supabase project, but only after the database checks pass.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "test/sql/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: ./test/sql/run.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the Supabase secrets are set
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "Missing repository secret: $name"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0 # pinned: 3.0 changed defaults (local target, write confirmation)

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply new migrations
        run: supabase db push --remote --yes
