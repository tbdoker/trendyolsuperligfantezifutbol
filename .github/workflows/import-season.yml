name: Import season

on:
  schedule:
    # Every day at 00:20 UTC (03:20 in Istanbul), just after API-Football's daily quota resets.
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: Season start year (2024 = 2024–25)
        default: "2024"
      budget:
        description: Maximum API requests for this run (free plan has 100 a day)
        default: "90"

permissions:
  contents: write

concurrency:
  group: import-season
  cancel-in-progress: false

env:
  SEASON: ${{ inputs.season || '2024' }}
  BUDGET: ${{ inputs.budget || '90' }}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Match data stays in the private build cache. The repository is public, so it is never committed.
      - name: Restore saved match data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: apifootball-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: apifootball-${{ env.SEASON }}-

      - name: Import new matches
        run: node scripts/import-season.mjs
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}

      - name: Save match data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: apifootball-${{ env.SEASON }}-${{ github.run_id }}

      - name: Analyse the season
        run: node scripts/analyze-season.mjs

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || (git commit -m "Update season ${SEASON} analysis" && git push)
