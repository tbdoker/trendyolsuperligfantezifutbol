name: Import season

on:
  # Nightly schedule paused (7 Nov): API-Football suspended the account, most likely because
  # GitHub's runners share IP addresses with many other users. Imports need a dedicated IP.
  # schedule:
  #   - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: Season start year (2024 = 2024–25)
        default: "2024"
      budget:
        description: Maximum API requests for this run (free plan has 100 a day; 0 = only sync what is saved)
        default: "90"

permissions:
  contents: write

concurrency:
  group: import-season
  cancel-in-progress: false

env:
  SEASON: ${{ inputs.season || '2024' }}
  # Empty on scheduled runs; the importer then uses its default of 90 requests.
  BUDGET: ${{ inputs.budget }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Match data stays in the private build cache. The repository is public, so it is never committed.
      - name: Restore saved match data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: apifootball-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: apifootball-${{ env.SEASON }}-

      - name: Import new matches
        run: node scripts/import-season.mjs
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}

      - name: Save match data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: apifootball-${{ env.SEASON }}-${{ github.run_id }}

      - name: Analyse the season
        run: node scripts/analyze-season.mjs

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || (git commit -m "Update season ${SEASON} analysis" && git pull --rebase && git push)

      # Supabase: clubs, players, provisional prices and hidden fixtures; results and stat lines
      # go to the private replay schema until the season clock reveals them.
      - name: Prepare the Supabase sync
        run: node scripts/sync-supabase.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0 # pinned: 3.0 changed defaults (local target, write confirmation)

      - name: Sync to Supabase
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Supabase secrets are not set; skipping the sync."; exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          for file in out/sync/*.sql; do
            echo "== $file"
            supabase db query --remote --yes -f "$file" > /dev/null
          done
          echo "Synced $(ls out/sync/*.sql | wc -l) files."
          supabase db query --remote --read-only "select
            (select count(*) from clubs) as clubs,
            (select count(*) from player_seasons where season_id = $SEASON) as players,
            (select count(*) from fixtures where season_id = $SEASON) as fixtures,
            (select count(*) from replay.match_stats) as hidden_stat_lines,
            (select count(*) from player_match_stats) as public_stat_lines"
